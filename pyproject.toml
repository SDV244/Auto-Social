[project]
name = "auto-social"
version = "0.1.0"
description = "Semi-automated faceless short-form content pipeline (research -> script -> voice -> render -> approval queue)."
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
research = ["yt-dlp"]
transcribe = ["faster-whisper"]
dev = ["pytest"]

[project.scripts]
auto-social = "auto_social.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
