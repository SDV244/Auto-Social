niche: "AI tools for business and productivity"
language: en
market: US
search_queries:            # used to find what is going viral in the niche
  - "best AI tools for productivity"
  - "AI tools small business"
  - "ChatGPT alternatives workflow"
max_candidates: 25         # videos pulled per query
max_age_days: 21           # only recent videos
min_views: 20000
monthly_budget_usd: 100    # hard cap; stages refuse to run beyond it
llm:
  provider: openrouter     # openrouter | anthropic
models:
  script: anthropic/claude-sonnet-5.5   # OpenRouter id. For provider=anthropic use claude-sonnet-5-5
voice:
  provider: none           # none | elevenlabs  (none = dry run, no cost)
  voice_id: ""
publish:
  provider: outbox         # outbox = local approval queue (default). postiz = see README
affiliate_cta: "Link in bio for the tool I use"   # replace with real tracked links
disclosure: "AI-assisted video. Affiliate links may be included."
